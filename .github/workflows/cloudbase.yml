name: Deploy to CloudBase

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Build static mirror
        run: npm run build:mirror

      - name: Install CloudBase CLI
        run: npm install -g @cloudbase/cli --no-audit --no-fund

      - name: Login to CloudBase
        run: tcb login --apiKeyId "${{ secrets.TCB_SECRET_ID }}" --apiKey "${{ secrets.TCB_SECRET_KEY }}"

      - name: Deploy to static hosting
        run: tcb hosting deploy out -e "${{ secrets.TCB_ENV_ID }}"
